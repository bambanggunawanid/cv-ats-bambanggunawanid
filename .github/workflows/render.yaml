name: Render CV

on:
  push:
    branches:
      - main
    paths:
      - 'cv.yaml'
      - 'config/**'
  workflow_dispatch:

env:
  USER_EMAIL: bambanggunawan887@gmail.com
  USER_NAME: bambanggunawanid
jobs:
  rendercv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Combine YAML files
        run: |
          cat cv.yaml > full_resume.yaml
          echo "" >> full_resume.yaml
          if [ -f config/design.yaml ]; then cat config/design.yaml >> full_resume.yaml; echo "" >> full_resume.yaml; fi
          if [ -f config/settings.yaml ]; then cat config/settings.yaml >> full_resume.yaml; fi

      - name: Run RenderCV Pipeline
        uses: rendercv/rendercv-pipeline-action@v1
        with:
          cv_file_path: full_resume.yaml
          generate_png_preview: false

      - name: Commit and Push Rendered PDF
        run: |
          git config --local user.email "${{ env.USER_EMAIL }}"
          git config --local user.name "${{ env.USER_NAME }}"

          mkdir -p output
          mv rendercv_output/*.pdf output/CV_Bambang_Gunawan.pdf 2>/dev/null || mv *.pdf output/CV_Bambang_Gunawan.pdf 2>/dev/null

          git add output/CV_Bambang_Gunawan.pdf
          git commit -m "chore: update rendered PDF [skip ci]" || exit 0
          git push