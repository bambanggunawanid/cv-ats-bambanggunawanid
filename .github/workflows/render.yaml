name: Render CV

on:
  push:
    branches:
      - main
    paths:
      - 'cv.yaml'
      - 'config/**'
  workflow_dispatch:

env:
  USER_EMAIL: bambanggunawan887@gmail.com
  USER_NAME: bambanggunawanid

jobs:
  rendercv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RenderCV
        run: pip install rendercv

      - name: Render CV
        run: |
          ARGS=(cv.yaml)
          [ -f config/design.yaml ]   && ARGS+=(--design config/design.yaml)
          [ -f config/locale.yaml ]   && ARGS+=(--locale-catalog config/locale.yaml)
          [ -f config/settings.yaml ] && ARGS+=(--settings config/settings.yaml)
          rendercv render "${ARGS[@]}"

      - name: Commit and Push Rendered PDF
        run: |
          git config --local user.email "${{ env.USER_EMAIL }}"
          git config --local user.name "${{ env.USER_NAME }}"

          PDF_YEAR=$(date +"%Y")
          OUTPUT_PDF="Bambang_Gunawan_CV_${PDF_YEAR}.pdf"

          mkdir -p output
          mv rendercv_output/*.pdf "output/${OUTPUT_PDF}" 2>/dev/null || mv *.pdf "output/${OUTPUT_PDF}" 2>/dev/null

          git add "output/${OUTPUT_PDF}"
          git commit -m "chore: update rendered PDF [skip ci]" || exit 0
          git push